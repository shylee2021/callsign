name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub has no macos-27 label yet; the Xcode 27 preview image runs macOS 27.0.
          - name: macOS 27
            runner: xcode-27
            required: true
          # macOS 26.6 with Xcode 26.6, GitHub's newest GA image. Fallback probe only:
          # Xcode 26.6 currently fails on AppIcon.icon before compiling any Swift.
          - name: macOS 26
            runner: macos-26
            required: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version
      - name: Unit test plan
        run: >
          xcodebuild test -scheme Callsign -testPlan Unit
          -derivedDataPath /tmp/dd
          CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          -skipPackagePluginValidation
