name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub has no macos-27 label yet; the Xcode 27 preview image runs macOS 27.0.
          - name: macOS 27
            runner: xcode-27
          # macOS 26.6 with Xcode 26.6, GitHub's newest GA image. The project leaves the
          # app icon out of macOS 26 SDK builds, since Xcode 26's actool cannot read it.
          - name: macOS 26
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version
      - name: Unit test plan
        run: >
          xcodebuild test -scheme Callsign -testPlan Unit
          -derivedDataPath /tmp/dd
          CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          -skipPackagePluginValidation
  appcast:
    name: Appcast tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s Tools -p 'test_*.py' -v
