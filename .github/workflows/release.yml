name: Release

on:
  push:
    tags: ["v*"]
  # Rebuilds and redeploys the appcast from the existing releases without building anything.
  workflow_dispatch:

# `shell: bash` turns on pipefail, so a failing command before a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  SPARKLE_VERSION: 2.10.0
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    if: github.event_name == 'push'
    # GitHub has no macos-27 label yet; the Xcode 27 preview image runs macOS 27.0.
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: python3 Tools/appcast.py parse "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version
          python3 --version

      - name: Sparkle tools
        run: |
          curl -sSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle

      # Ad hoc until the Developer ID secrets exist. The hardened runtime is on either way.
      - name: Signing identity
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$DEVELOPER_ID_P12_BASE64" ]; then
            echo "No Developer ID certificate; signing ad hoc."
            { echo "identity=-"; echo "method=mac-application"; echo "team="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DEVELOPER_ID_P12_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "DEVELOPER_ID_P12_PASSWORD and APPLE_TEAM_ID must be set with the certificate." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          { echo "identity=Developer ID Application"; echo "method=developer-id"; echo "team=$APPLE_TEAM_ID"; } >> "$GITHUB_OUTPUT"

      - name: Archive
        run: >
          xcodebuild archive -scheme Callsign -configuration Release
          -archivePath "$RUNNER_TEMP/Callsign.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGN_STYLE=Manual
          "CODE_SIGN_IDENTITY=${{ steps.signing.outputs.identity }}"
          "DEVELOPMENT_TEAM=${{ steps.signing.outputs.team }}"
          "MARKETING_VERSION=${{ steps.tag.outputs.version }}"
          "CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          -skipPackagePluginValidation

      - name: Export
        env:
          METHOD: ${{ steps.signing.outputs.method }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM: ${{ steps.signing.outputs.team }}
        run: |
          OPTIONS="$RUNNER_TEMP/export-options.plist"
          cp .github/export-options.plist "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :method $METHOD" -c "Set :signingCertificate $IDENTITY" "$OPTIONS"
          if [ -n "$TEAM" ]; then /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" "$OPTIONS"; fi
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Callsign.xcarchive" \
            -exportOptionsPlist "$OPTIONS" -exportPath "$RUNNER_TEMP/export"
          test -d "$RUNNER_TEMP/export/Callsign.app"

      # Skipped until the App Store Connect API key secrets exist.
      - name: Notarize
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_P8" ]; then
            echo "No App Store Connect key; skipping notarization."
            exit 0
          fi
          if [ "${{ steps.signing.outputs.method }}" != "developer-id" ]; then
            echo "Notarization needs a Developer ID signed build." >&2
            exit 1
          fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY_P8" > "$KEY"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Callsign.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --key "$KEY" --key-id "$APP_STORE_CONNECT_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            | tee "$RUNNER_TEMP/notarize.log"
          rm "$KEY"
          grep -q "status: Accepted" "$RUNNER_TEMP/notarize.log"
          xcrun stapler staple "$RUNNER_TEMP/export/Callsign.app"

      - name: Package and sign
        id: package
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "SPARKLE_ED_PRIVATE_KEY is not set." >&2
            exit 1
          fi
          ARCHIVE="Callsign-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/export/Callsign.app" "$ARCHIVE"
          SIGNATURE="$(printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - -p "$ARCHIVE")"
          test -n "$SIGNATURE"
          python3 Tools/appcast.py item --tag "$GITHUB_REF_NAME" --build "$GITHUB_RUN_NUMBER" \
            --app "$RUNNER_TEMP/export/Callsign.app" --archive "$ARCHIVE" \
            --signature "$SIGNATURE" --output appcast-item.json
          cat appcast-item.json
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # A rerun after a partial failure re-uploads the assets instead of failing on the existing release.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" appcast-item.json --clobber
          else
            PRERELEASE=()
            if [ "$CHANNEL" != "stable" ]; then PRERELEASE=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" appcast-item.json \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${PRERELEASE[@]}"
          fi

  appcast:
    name: Deploy appcast
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Every published release carries an appcast-item.json; the feed is rebuilt from all of them.
      - name: Collect release items
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir items
          for tag in $(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName'); do
            if ! gh release download "$tag" --pattern appcast-item.json --dir "items/$tag"; then
              echo "::warning::release $tag has no appcast-item.json; left out of the feed"
            fi
          done
          find items -type f

      - name: Build appcast
        run: |
          mkdir site
          python3 Tools/appcast.py build items site/appcast.xml --repository "$GITHUB_REPOSITORY"
          cat site/appcast.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
